<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjo — veja funcionando</title>
<meta name="description" content="Em menos de três minutos: como o Tarjo encontra, remove e verifica dados pessoais em documentos públicos, com laudo assinado.">
<meta property="og:title" content="Tarjo — veja funcionando">
<meta property="og:image" content="https://tarjo.com.br/video/poster.jpg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --tinta:#0E1116; --marinho:#1B3A66; --papel:#F7F7F4; --linha:#DEDED8; --suave:#3A404A; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--papel); color:var(--tinta); font-family:'Segoe UI',Arial,sans-serif; }
  main { max-width:960px; margin:0 auto; padding:32px 16px 56px; }
  a.marca { color:var(--tinta); text-decoration:none; font-weight:700; font-size:20px; }
  h1 { font-size:clamp(26px,4vw,38px); line-height:1.15; margin:28px 0 10px; letter-spacing:-.5px; }
  p { color:var(--suave); font-size:17px; line-height:1.55; max-width:680px; }
  video { width:100%; border-radius:10px; border:1px solid var(--linha); background:#000; margin:18px 0 22px; }
  .acoes a { display:inline-block; margin:0 10px 10px 0; padding:12px 18px; border-radius:8px; text-decoration:none; font-weight:600; }
  .pri { background:var(--marinho); color:#fff; } .sec { border:1px solid var(--marinho); color:var(--marinho); }
  small { color:#8A8F98; }
</style>
</head>
<body>
<main>
  <a class="marca" href="./">Tarjo</a>
  <h1>Veja o Tarjo funcionando</h1>
  <p>Do documento enviado ao PDF publicado com laudo assinado: o que o Tarjo encontra, como a equipe confere e por que o dado não volta.</p>
  <video controls preload="metadata" poster="video/poster.jpg" playsinline>
    <source src="video/tarjo-institucional.mp4" type="video/mp4">
  </video>
  <div class="acoes">
    <a class="pri" href="./#contato">Agendar demonstração com um documento seu</a>
    <a class="sec" href="./#planos">Planos e contratação por dispensa</a>
  </div>
  <p><small>Os documentos e pessoas do vídeo são fictícios.</small></p>
</main>
</body>
</html>
