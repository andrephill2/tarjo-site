# Vigia: testa os sites a cada 10 min. Se algum cair, abre uma issue (o GitHub avisa por e-mail);
# quando voltar, fecha a issue. Sem serviço externo, sem chave.
name: vigia
on:
  schedule: [{ cron: "*/10 * * * *" }]
  workflow_dispatch:
permissions: { issues: write }
jobs:
  vigia:
    runs-on: ubuntu-latest
    steps:
      - name: testar
        id: t
        run: |
          falhas=""
          for u in https://tarjo.com.br/ https://app.tarjo.com.br/entrar https://demo.app.tarjo.com.br/entrar https://licitrend.com.br/ https://licitrend.com.br/api/session; do
            c=$(curl -s -o /dev/null -m 25 -w "%{http_code}" "$u" || echo 000)
            echo "$c $u"; [ "$c" = 200 ] || falhas="$falhas\n- $u → HTTP $c"
          done
          printf 'falhas<<EOF\n%b\nEOF\n' "$falhas" >> "$GITHUB_OUTPUT"
      - name: avisar ou fechar
        uses: actions/github-script@v7
        env: { FALHAS: "${{ steps.t.outputs.falhas }}" }
        with:
          script: |
            const titulo = '🔴 Site fora do ar';
            const { data: abertas } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'vigia' });
            const falhas = (process.env.FALHAS || '').trim();
            const agora = new Date().toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' });
            if (falhas) {
              if (abertas.length) await github.rest.issues.createComment({ ...context.repo, issue_number: abertas[0].number, body: `Ainda fora (${agora}):\n${falhas}` });
              else await github.rest.issues.create({ ...context.repo, title: titulo, labels: ['vigia'], body: `Verificação de ${agora} falhou:\n${falhas}\n\nServidor: 2.25.234.204 (Hostinger srv1990352). Entre por SSH e rode \`docker ps\` em /opt/tarjo.` });
            } else if (abertas.length) {
              for (const i of abertas) { await github.rest.issues.createComment({ ...context.repo, issue_number: i.number, body: `✅ Tudo de volta em ${agora}.` }); await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: 'closed' }); }
            }
